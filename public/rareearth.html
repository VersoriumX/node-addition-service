<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Metal Prices</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h2>Real-Time Metal Prices</h2>
    <canvas id="metalChart"></canvas>

    <script>
        const metals = {
            gold: { color: 'gold', symbol: 'XAU' },
            platinum: { color: 'plum', symbol: 'XPT' },
            silver: { color: 'silver', symbol: 'XAG' },
            nickel: { color: 'lightblue', symbol: 'NICKEL' },
            copper: { color: 'brown', symbol: 'COPPER' }
        };

        const ctx = document.getElementById('metalChart').getContext('2d');
        const datasets = Object.keys(metals).map(metal => ({
            label: metal.charAt(0).toUpperCase() + metal.slice(1),
            borderColor: metals[metal].color,
            backgroundColor: metals[metal].color,
            data: [],
            fill: false,
            tension: 0.1,
            symbol: metals[metal].symbol
        }));

        const metalChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: datasets
            },
            options: {
                responsive: true,
                scales: {
                    x: {
                        display: true,
                        title: {
                            display: true,
                            text: 'Time'
                        }
                    },
                    y: {
                        beginAtZero: false,
                        title: {
                            display: true,
                            text: 'Price'
                        }
                    }
                }
            }
        });

        async function fetchPrices() {
            try {
                const response = await fetch('/api/prices/metals');
                const data = await response.json();
                return data.rates;
            } catch (error) {
                console.error('Error fetching prices:', error);
                return null;
            }
        }

        async function updateChart() {
            const rates = await fetchPrices();
            if (!rates) return;

            const now = new Date().toLocaleTimeString();

            if (metalChart.data.labels.length > 20) {
                metalChart.data.labels.shift();
            }
            metalChart.data.labels.push(now);

            metalChart.data.datasets.forEach(dataset => {
                const price = rates[dataset.symbol];
                if (dataset.data.length > 20) {
                    dataset.data.shift();
                }
                dataset.data.push(price !== undefined ? price : null);
            });

            metalChart.update();
        }

        setInterval(updateChart, 5000);
        updateChart(); // Initial call
    </script>
</body>
</html>
