<h2>Real-Time Metal Prices</h2>
<canvas id="metalChart"></canvas>

<script>
    const metals = {
        gold: { color: 'gold', symbol: 'XAU' },
        platinum: { color: 'plum', symbol: 'XPT' },
        silver: { color: 'silver', symbol: 'XAG' },
        nickel: { color: 'lightblue', symbol: 'NICKEL' },
        copper: { color: 'brown', symbol: 'COPPER' }
    };

    const ctx = document.getElementById('metalChart').getContext('2d');
    const datasets = Object.keys(metals).map(metal => ({
        label: metal.charAt(0).toUpperCase() + metal.slice(1),
        borderColor: metals[metal].color,
        backgroundColor: metals[metal].color,
        data: [],
        fill: false,
        tension: 0.1
    }));

    const metalChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: datasets
        },
        options: {
            responsive: true,
            scales: {
                x: {
                    type: 'linear',
                    position: 'bottom'
                },
                y: {
                    beginAtZero: false
                }
            }
        }
    });

    async function fetchPrices() {
        const apiKey = 'YOUR_METALS_API_KEY'; // Replace with your Metals-API key
        const url = `https://metals-api.com/api/latest?access_key=${apiKey}&currencies=XAU,XPT,XAG,NICKEL,COPPER`;

        const response = await fetch(url);
        const data = await response.json();
        return data.rates; // Return the rates object
    }

    async function updateChart() {
        const prices = await fetchPrices();
        const now = new Date().toLocaleTimeString();

        metalChart.data.labels.push(now);
        Object.keys(prices).forEach(metal => {
            const dataset = metalChart.data.datasets.find(ds => ds.label.toLowerCase() === metal);
            dataset.data.push(prices[metal]);
        });

        if (metalChart.data.labels.length > 20) { // Keep only the last 20 data points
            metalChart.data.labels.shift();
            datasets.forEach(dataset => dataset.data.shift());
        }

        metalChart.update();
    }

    setInterval(updateChart, 5000); // Update every 5 seconds
</script>
